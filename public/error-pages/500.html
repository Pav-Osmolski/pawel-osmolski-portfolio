<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>500 — Internal Server Error | Pawel Osmolski</title>
<link rel="preload" href="/assets/fonts/league-gothic.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:League;src:url('/assets/fonts/league-gothic.woff2') format('woff2');font-display:swap}
:root{color-scheme:dark;--bg:#0c0d0f;--text:#eeeae3;--muted:#abaeb2;--accent:#c5dca6;--line:#303337}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.75 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column}
.wrap{width:min(1160px,calc(100% - 40px));margin-inline:auto}
header{padding-block:28px;border-bottom:1px solid var(--line)}
a{color:inherit;text-underline-offset:5px}
a:hover{color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.brand{font-weight:600;text-decoration:none}
main{flex:1;padding-block:clamp(64px,12vh,140px)}
.code{color:var(--accent);font-size:.8rem;letter-spacing:.18em;text-transform:uppercase}
h1{font-family:League,'Arial Narrow',sans-serif;font-weight:400;font-size:clamp(3.5rem,10vw,7rem);line-height:1.05;margin:20px 0 28px;overflow-wrap:anywhere}
.message{color:var(--muted);max-width:540px;margin-bottom:32px}
.actions{display:flex;flex-wrap:wrap;gap:16px}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border:1px solid var(--accent);text-decoration:none;transition:color .2s ease,background-color .2s ease}
.button--primary{background:var(--accent);color:var(--bg)}
.button:hover{background:var(--text);color:var(--bg)}
footer{padding-block:24px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
@media(prefers-reduced-motion:reduce){.button{transition:none}}
</style>
</head>
<body>
<header class="wrap"><a class="brand" href="/">Pawel Osmolski</a></header>
<main class="wrap" id="main">
<p class="code">Error 500 / Internal Server Error</p>
<h1>A brief interruption.</h1>
<p class="message">The server couldn’t complete your request. Please try again in a moment. If it keeps happening, get in touch.</p>
<div class="actions">
<a class="button button--primary" href="/">Back to the portfolio <span aria-hidden="true">&nbsp;↗</span></a>
<a class="button" href="mailto:pawel@pawel-osmolski.com">Get in touch</a>
</div>
</main>
<footer class="wrap">Music / Web development / Sound design</footer>
</body>
</html>
